name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: make tools

      - name: Lint
        run: make lint

      - name: Test
        run: go test ./... -race -count=1

  build:
    name: cross-build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every target goreleaser ships
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              bin/build-binary.sh --out "dist/gitlift_${target%/*}_${target#*/}"
          done
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: gitlift-binaries
          path: dist/
          if-no-files-found: error
