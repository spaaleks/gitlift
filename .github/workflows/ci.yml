name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: make tools

      - name: Lint
        run: make lint

      - name: Test
        run: go test ./... -race -count=1

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: bin/build-binary.sh --out "dist/gitlift_${{ matrix.goos }}_${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: gitlift_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/gitlift_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error
