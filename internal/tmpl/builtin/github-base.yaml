name: "GitHub base"
description: "Default GitHub repository settings"
repo:
  visibility: "private"
  description: ""
  features:
    issues: true
    wiki: false
    projects: false
branch_rules:
  rules:
    - name: "main"
      patterns: ["main"]
      allow_force_push: false
      merge_access: "admins"
      merge_methods: ["merge"]
    - name: "dev-branches"
      patterns: ["dev", "dev-*"]
      allow_force_push: false
      merge_access: "admins"
      merge_methods: ["squash"]
actions:
  fork_pr_approval: "all_external_contributors"
  outside_access: "none"
  default_workflow_permissions: "read"
  can_approve_pull_requests: false
providers:
  github:
    context:
      owner: ""
      owner_type: "user"
